name: checks
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.17"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
      - run: uv build
      - run: uv run --frozen python scripts/check_wheel.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t zscore-dashboard .
      - name: Smoke test packaged application
        shell: bash
        run: |
          docker run -d --name dashboard -p 7860:7860 zscore-dashboard
          trap 'docker logs dashboard; docker rm -f dashboard' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7860/ > /tmp/dashboard.html; then
              grep -q 'ctrl-ticker' /tmp/dashboard.html
              exit 0
            fi
            sleep 2
          done
          exit 1
